services:
  db:
    image: postgis/postgis:16-3.4
    container_name: zeladoria-db
    environment:
      POSTGRES_USER: zeladoria
      POSTGRES_PASSWORD: zeladoria
      POSTGRES_DB: zeladoria
    ports:
      # Porta do HOST configurável: um Postgres de outro projeto já ocupando a
      # 5432 é o caso comum, e o sintoma é traiçoeiro — o container sobe e fica
      # `healthy` (o healthcheck roda por dentro), mas o bind falha e o
      # DATABASE_URL passa a conectar no banco do outro projeto. Defina DB_PORT
      # no `.env` da raiz para escapar do conflito.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeladoria -d zeladoria"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    container_name: zeladoria-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zeladoria
      MINIO_ROOT_PASSWORD: zeladoria123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data

volumes:
  db_data:
  storage_data:
