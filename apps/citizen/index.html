<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Duas metas com `media` cobrem quem segue o sistema; a terceira, sem
         `media`, é a que o useTheme reescreve quando o usuário força um tema. -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>Zeladoria.gov</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Anti-flash: precisa rodar antes do primeiro paint, senão quem usa tema
         escuro leva um clarão branco a cada carregamento. Espelha
         NO_FLASH_SCRIPT de packages/ui/src/lib/useTheme.tsx — se um mudar, o
         outro muda junto. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('zeladoria-theme');
          var d = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (d) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
